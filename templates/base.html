<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Hidde&#8209;Jan — www.hidde-jan.nl{% endblock %}</title>
    <meta name="description" content="{% block description %}Personal page of Hidde‑Jan Jongsma — researcher at TNO, alumnus of the University of Groningen.{% endblock %}" />

    <style>
      @import url(https://fonts.bunny.net/css?family=inter:400,500|space-grotesk:500,700);

      *,*::before,*::after { box-sizing: border-box }
      html, body { height: 100%; margin: 0 }
      body { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }

      /* ── Themes ── */
      .theme-matcha, :root {
        --bg:     #131a0f;
        --fg:     #EDE8FF;
        --accent: #C084FC;
        --muted:  color-mix(in oklab, var(--fg) 65%, var(--bg));
        --max:    640px;
      }
      .theme-groovy {
        --bg:     #1C0F00;
        --fg:     #F5E6C8;
        --accent: #E8640C;
        --muted:  color-mix(in oklab, var(--fg) 65%, var(--bg));
      }
      .theme-navy {
        --bg:     #09091A;
        --fg:     #F0EEFF;
        --accent: #FF2D6F;
        --muted:  color-mix(in oklab, var(--fg) 65%, var(--bg));
      }

      body {
        background: var(--bg);
        color: var(--fg);
        font-family: Inter, system-ui, sans-serif;
        font-weight: 400;
      }

      .wrap { width: min(100% - 48px, var(--max)); margin-inline: auto; }

      /* ── Header ── */
      header { padding: 72px 0 56px; }

      h1 {
        font-family: "Space Grotesk", system-ui, sans-serif;
        font-weight: 700;
        font-size: clamp(52px, 14vw, 88px);
        letter-spacing: -3px;
        line-height: .95;
        margin: 0;
        color: var(--fg);
      }

      h1 .last {
        display: block;
        color: var(--accent);
      }

      /* ── Nav ── */
      nav {
        margin-top: 24px;
        display: flex;
        gap: 20px;
      }

      nav a {
        color: var(--muted);
        text-decoration: none;
        font-family: "Space Grotesk", system-ui, sans-serif;
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 1px;
        text-transform: uppercase;
      }

      nav a:hover,
      nav a[aria-current="page"] {
        color: var(--accent);
        transition: color 0.18s ease;
      }

      /* ── Sections ── */
      main { padding: 0 0 88px; }

      .section { margin-top: 48px; }

      .section-heading {
        font-family: "Space Grotesk", system-ui, sans-serif;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: var(--accent);
        margin: 0 0 18px;
      }

      .section ul {
        list-style: none;
        padding: 0;
        margin: 0;
        display: grid;
        gap: 14px;
      }

      .section a {
        color: var(--fg);
        text-decoration: none;
        display: block;
      }

      .section a:hover .link-title {
        color: var(--accent);
        transition: color 0.18s ease;
      }

      .link-title {
        display: block;
        font-family: "Space Grotesk", system-ui, sans-serif;
        font-weight: 500;
        font-size: clamp(15px, 2.4vw, 17px);
      }

      .link-sub {
        display: block;
        font-size: 13px;
        color: var(--muted);
        margin-top: 3px;
        font-weight: 400;
      }

      /* ── Post list ── */
      .post-list {
        list-style: none;
        padding: 0;
        margin: 0;
        display: grid;
        gap: 14px;
      }

      .post-list a {
        color: var(--fg);
        text-decoration: none;
        display: block;
      }

      .post-list a:hover .link-title {
        color: var(--accent);
        transition: color 0.18s ease;
      }

      /* ── Post page ── */
      .post-header { margin-top: 48px; margin-bottom: 32px; }

      .post-title {
        font-family: "Space Grotesk", system-ui, sans-serif;
        font-weight: 700;
        font-size: clamp(24px, 6vw, 36px);
        letter-spacing: -1px;
        margin: 0 0 8px;
        color: var(--fg);
      }

      .post-date {
        font-size: 13px;
        color: var(--muted);
        margin: 0;
      }

      .post-body {
        margin-top: 32px;
        line-height: 1.7;
        font-size: clamp(15px, 2.4vw, 17px);
      }

      .post-body h2, .post-body h3 {
        font-family: "Space Grotesk", system-ui, sans-serif;
        color: var(--fg);
      }

      .post-body a {
        color: var(--accent);
      }

      .post-body code {
        background: color-mix(in oklab, var(--fg) 8%, var(--bg));
        padding: 0.1em 0.4em;
        border-radius: 3px;
        font-size: 0.9em;
      }

      .post-body pre {
        background: color-mix(in oklab, var(--fg) 8%, var(--bg));
        padding: 16px;
        border-radius: 6px;
        overflow-x: auto;
      }

      .post-body pre code {
        background: none;
        padding: 0;
      }

      .back-link {
        display: inline-block;
        margin-top: 48px;
        color: var(--muted);
        text-decoration: none;
        font-size: 13px;
        font-family: "Space Grotesk", system-ui, sans-serif;
        font-weight: 500;
        letter-spacing: 0.5px;
      }

      .back-link:hover {
        color: var(--accent);
      }

      /* ── Footer ── */
      footer { padding: 32px 0 48px; color: var(--muted); font-size: 13px; cursor: pointer; user-select: none; }
    </style>
  </head>
  <body class="theme-matcha">
    <header class="wrap">
      <h1><a href="/" style="color:inherit;text-decoration:none">Hidde&#8209;Jan<span class="last">Jongsma</span></a></h1>
      <nav>
        <a href="/" {% if current_path == "/" %}aria-current="page"{% endif %}>Home</a>
        <a href="/posts/" {% if current_path is starting_with("/posts") %}aria-current="page"{% endif %}>Posts</a>
      </nav>
    </header>

    <main class="wrap">
      {% block content %}{% endblock %}
    </main>

    <footer class="wrap">
      <small>© <span id="y"></span> Hidde‑Jan Jongsma · www.hidde-jan.nl</small>
    </footer>

    <script>
      document.getElementById('y').textContent = new Date().getFullYear();

      const themes = ['theme-matcha', 'theme-groovy', 'theme-navy'];
      document.body.className = themes[Math.floor(Math.random() * themes.length)];

      document.querySelector('footer').addEventListener('click', () => {
        const current = themes.indexOf(document.body.className);
        document.body.className = themes[(current + 1) % themes.length];
      });
    </script>
  </body>
</html>
